name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FONTS_VERSION: webfonts-v0.1.0

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fonts are commercially licensed and live in the private x-amz/webfonts
      # repo; they are fetched here and never committed to this public one.
      - uses: actions/create-github-app-token@v2
        id: fonts-token
        with:
          app-id: ${{ vars.FONTS_APP_ID }}
          private-key: ${{ secrets.FONTS_APP_KEY }}
          owner: x-amz
          repositories: webfonts
      - name: Fetch webfonts
        env:
          GH_TOKEN: ${{ steps.fonts-token.outputs.token }}
        run: |
          # Actions runs `bash -e` without pipefail, so a piped `gh ... | tar`
          # exits 0 when the download fails and the site deploys with no faces
          # and a green tick. Download to a file, then assert what landed.
          set -euo pipefail
          mkdir -p static/fonts
          gh release download "$FONTS_VERSION" --repo x-amz/webfonts \
            --pattern byte-glass.tar.gz --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP/byte-glass.tar.gz" -C static/fonts
          test -f static/fonts/fonts.css
          faces=$(find static/fonts -name '*.woff2' | wc -l | tr -d ' ')
          [ "$faces" -gt 0 ]
          echo "fetched $faces faces from $FONTS_VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          # Artifacts on a public repo are world-downloadable; keep the
          # licensed faces around no longer than the deploy needs.
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
